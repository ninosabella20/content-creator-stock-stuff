name: Rebuild podcast feed

# Regenerates docs/podcast/feed.xml from the episode ledger, e.g. after changing the
# PODCAST_OWNER_EMAIL repository variable. Publishes nothing new.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-production
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests PyYAML numpy Pillow matplotlib
      - name: Rebuild feed
        env:
          PODCAST_OWNER_EMAIL: ${{ vars.PODCAST_OWNER_EMAIL }}
        run: python -m src.main rebuild-feed
      - name: Commit feed
        run: |
          if [ -z "$(git status --porcelain docs/)" ]; then echo "feed unchanged"; exit 0; fi
          git config user.name  "market-brief-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/podcast
          git commit -m "Rebuild podcast feed"
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
